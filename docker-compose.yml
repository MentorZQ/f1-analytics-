services:
  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"

  app:
    build: .
    depends_on:
      - chroma
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    ports:
      - "8080:8080"

volumes:
  chroma_data:
